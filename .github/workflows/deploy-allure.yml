name: Deploy Allure Report

on:
  push:
    branches: [ develop3, main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run tests and verify results
      run: |
        echo "Запускаем тесты..."
        mvn clean test
        
        echo "Проверяем результаты..."
        if [ -d "target/allure-results" ]; then
          COUNT=$(find target/allure-results -name "*.json" | wc -l)
          echo "✓ Найдено $COUNT файлов результатов тестов"
        else
          echo "✗ Ошибка: allure-results не созданы"
          exit 1
        fi
    
    - name: Install Allure CLI
      run: |
        echo "Устанавливаем Allure..."
        wget -qO allure-2.24.0.tgz https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -xzf allure-2.24.0.tgz
        echo "Allure установлен"
    
    - name: Generate Allure Report
      run: |
        echo "Генерируем отчет..."
        ./allure-2.24.0/bin/allure generate target/allure-results --clean -o allure-report
        
        echo "Проверяем сгенерированный отчет:"
        ls -la allure-report/
        echo "Файлов в отчете: $(find allure-report -type f | wc -l)"
    
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v3
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: ./allure-report
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
